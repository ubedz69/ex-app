    <path d="M70 110 L120 145" stroke="#FF9A1C" stroke-width="10"/>
    <circle cx="175" cy="150" r="12" fill="#FF9A1C"/>
  </g>

  <!-- Silly map markers -->
  <g transform="translate(650,330)">
    <path d="M70 0 C45 0, 25 20, 25 45 C25 75, 70 140, 70 140 C70 140, 115 75, 115 45 C115 20, 95 0, 70 0 Z"
