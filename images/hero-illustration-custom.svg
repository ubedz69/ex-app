  </g>

  <!-- Bottom brand band -->
  <g>
    <rect x="110" y="430" width="680" height="70" rx="24" fill="#FFFFFF" stroke="#0B5DA7" stroke-width="10" opacity="0.98"/>
    <path d="M170 465 C220 430, 290 430, 340 465 C390 500, 460 500, 510 465 C560 430, 640 430, 690 465"
